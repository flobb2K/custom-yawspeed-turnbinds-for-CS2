//	—————	Setup for Cycle Binds	————————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//setup for two different yawspeeds on one single key

alias "2yaw_cycle" "alias 2yaw_cycle 2yaw_cycle1";
alias "2yaw_cycle1" "2yawspeed1; alias 2yaw_cycle 2yaw_cycle2";
alias "2yaw_cycle2" "2yawspeed2; alias 2yaw_cycle 2yaw_cycle1";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//setup for three different yawspeeds on one single key

alias "3yaw_cycle" "alias 3yaw_cycle 3yaw_cycle1";
alias "3yaw_cycle1" "3yawspeed1; alias 3yaw_cycle 3yaw_cycle2";
alias "3yaw_cycle2" "3yawspeed2; alias 3yaw_cycle 3yaw_cycle3";
alias "3yaw_cycle3" "3yawspeed3; alias 3yaw_cycle 3yaw_cycle1";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//setup for four different yawspeeds on one single key

alias "4yaw_cycle" "alias 4yaw_cycle 4yaw_cycle1";
alias "4yaw_cycle1" "4yawspeed1; alias 4yaw_cycle 4yaw_cycle2";
alias "4yaw_cycle2" "4yawspeed2; alias 4yaw_cycle 4yaw_cycle3";
alias "4yaw_cycle3" "4yawspeed3; alias 4yaw_cycle 4yaw_cycle4";
alias "4yaw_cycle4" "4yawspeed4; alias 4yaw_cycle 4yaw_cycle1";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//setup for two different pitchspeeds on one single key

alias "2pitch_cycle" "alias 2pitch_cycle 2pitch_cycle1";
alias "2pitch_cycle1" "2pitchspeed1; alias 2pitch_cycle 2pitch_cycle2";
alias "2pitch_cycle2" "2pitchspeed2; alias 2pitch_cycle 2pitch_cycle1";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//setup for three different pitchspeeds on one single key

alias "3pitch_cycle" "alias 3pitch_cycle 3pitch_cycle1";
alias "3pitch_cycle1" "3pitchspeed1; alias 3pitch_cycle 3pitch_cycle2";
alias "3pitch_cycle2" "3pitchspeed2; alias 3pitch_cycle 3pitch_cycle3";
alias "3pitch_cycle3" "3pitchspeed3; alias 3pitch_cycle 3pitch_cycle1";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Setup for Speed Key		————————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————

alias "+speed_key" "speed2";
alias "-speed_key" "speed1";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Setup for crosshair color change	————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————

alias crosshair_color_2 "cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255";
alias crosshair_color_3 "cl_crosshaircolor_r 175; cl_crosshaircolor_g 175; cl_crosshaircolor_b 255";
alias crosshair_color_4 "cl_crosshaircolor_r 0; cl_crosshaircolor_g 100; cl_crosshaircolor_b 255";
alias crosshair_color_5 "cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 255";
alias crosshair_color_6 "cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 45";
alias crosshair_color_7 "cl_crosshaircolor_r 225; cl_crosshaircolor_g 110; cl_crosshaircolor_b 0";
alias crosshair_color_8 "cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 35";
alias crosshair_color_9 "cl_crosshaircolor_r 0; cl_crosshaircolor_g 255; cl_crosshaircolor_b 0";
alias crosshair_color_10 "cl_crosshaircolor_r 120; cl_crosshaircolor_g 210; cl_crosshaircolor_b 255";
alias crosshair_color_11 "cl_crosshaircolor_r 250; cl_crosshaircolor_g 150; cl_crosshaircolor_b 200";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Setup for hud + crosshair color change	————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————

alias crosshair_hud_color_2 "cl_hud_color 2; crosshair_color_2";
alias crosshair_hud_color_3 "cl_hud_color 3; crosshair_color_3";
alias crosshair_hud_color_4 "cl_hud_color 4; crosshair_color_4";
alias crosshair_hud_color_5 "cl_hud_color 5; crosshair_color_5";
alias crosshair_hud_color_6 "cl_hud_color 6; crosshair_color_6";
alias crosshair_hud_color_7 "cl_hud_color 7; crosshair_color_7";
alias crosshair_hud_color_8 "cl_hud_color 8; crosshair_color_8";
alias crosshair_hud_color_9 "cl_hud_color 9; crosshair_color_9";
alias crosshair_hud_color_10 "cl_hud_color 10; crosshair_color_10";
alias crosshair_hud_color_11 "cl_hud_color 11; crosshair_color_11";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Setup for sounds	————————————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————

alias sound1 "snd_toolvolume 0.05; play sounds/ui/beepclear";
alias sound2 "snd_toolvolume 0.05; play sounds/buttons/blip1";
alias sound3 "snd_toolvolume 0.05; play sounds/buttons/blip2";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————

echoln "turnbinds/setup/setup.cfg successfully executed!";