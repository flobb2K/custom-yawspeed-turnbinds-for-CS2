//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//	- Step #1 Basic Setup - setting up turnkeys/pitchkeys and cl_yawspeed/cl_pitchspeed
//	- Step #2 Changing yawspeed during gameplay - setting up yawspeed binds
//	- Step #3 Changing pitchspeed during gameplay - setting up pitchspeed binds
//	- Step #4 Adding color changes to your binds - visual feedback for binds
//	- Step #5 Adding sound effects to your binds - audio feedback for binds

//	————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1 - Basic Setup	————————————————————————————————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1.1 - Setting up Turnkeys	(turnleft/turnright)	————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Turnkeys are the buttons used for turning left and right.
//	This option is enabled by default. Only the keys have to be changed if you don't like the defaults.
//	Most people use MOUSE1/MOUSE2, Q/E or MOUSE4/MOUSE5. Replace [MOUSE1/MOUSE2] with your desired turnkeys.
//	To deactivate add // at the start of both lines.

bind "MOUSE1" "+turnleft_custom";
bind "MOUSE2" "+turnright_custom";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1.2 - Setting cl_yawspeed (turnleft/turnright)	————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Yawspeed is measured in degrees/second.
//	300 is CS2's default/maximum yawspeed. 1 is the minimum yawspeed. Only use whole numbers!
//	Using this config you're able to type "cl_yawspeed_[value]" in the developer console like in CSS.
//	This command is enabled by default and sets a default value for the turnkeys to use.
//	This does not affect any kind of yawspeed bind. To change the default value edit the following command!

cl_yawspeed_300

//	————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1.3 - Setting up your Pitchkeys (turnup/turndown)	————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Pitchkeys are the buttons used for turning up and down.
//	To activate remove // from the start of both lines and then replace [key] with your desired pitchkeys.
//	To deactivate add // at the start of both lines.

//bind "[key]" "+turnup_custom";
//bind "[key]" "+turndown_custom";

//	————————————————————————————————————————————————————————————————————————————————————————————————————————
//	—————	Step #1.4 - Setting cl_pitchspeed (turnup/turndown)	————————————————————————————————————————————
//	————————————————————————————————————————————————————————————————————————————————————————————————————————

//	Pitchspeed is measured in degrees/second.
//	45 is CS2's default/maximum pitchspeed. 1 is the minimum pitchspeed. Only use whole numbers!
//	Using this config you're able to type "cl_pitchspeed_[value]" in the developer console like in CSS.
//	This command is enabled by default and sets a default value for the pitchkeys to use.
//	This does not affect any kind of pitchspeed bind. To change the default value edit the following command!

cl_pitchspeed_45

